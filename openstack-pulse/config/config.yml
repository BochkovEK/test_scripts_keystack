# config/config.yml
# Services list for diagnostics

# logging
log:
  enable_log: True
#  path: "/var/log/openstack-pulse"  # /tmp by default

# Check services
check_services:
  - nova
  - cinder
  - neutron
  - keystone
  - adminui
  - glance
#  - rabbitmq
#  - galera

# Single check services
single_mode_checks:
  - placement

mariadb:
  #python3 -c 'import os, mysql.connector; print("🔄 Try to connect..."); c=mysql.connector.connect(host="10.224.138.180", user="root", password=os.getenv("MYSQL_PASS"), port=3306, connect_timeout=3); print("🟢 Success"); c.close()'
  port: 3306

adminui:
  protocol: "https"
#  port: 12999
#  cacert_path: "/path/to/ca-bundle.crt"
  timeout: 12

rabbitmq:
#  username: "" from ENV RABBIT_USER
#  password: "" from ENV RABBIT_PASS

  protocol: "https"
#  cacert_path : "/path/to/ca-bundle.crt"
  port: "15672"

# Timing parameters
intervals:
  check_interval: 5   # Interval between checks (seconds)
  duration: 300       # Data collection window (seconds) - 5 minutes

# Pulse settings
heartbeat_requests_services: 4