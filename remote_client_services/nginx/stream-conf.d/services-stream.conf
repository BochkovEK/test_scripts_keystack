server_names_hash_bucket_size 128;

# Неизвестный SNI — отклоняем соединение
server {
    listen 443 default_server;
    ssl_preread on;
    proxy_pass 127.0.0.1:9;
}

# Existing services: TLS termination in HTTP context
server {
    listen 443;
    server_name
        opensearch.ebochkov-client-remote-services.vm.lab.itkey.com
        vault-test.ebochkov-client-remote-services.vm.lab.itkey.com
        nexus-test.ebochkov-client-remote-services.vm.lab.itkey.com
        docker-test.ebochkov-client-remote-services.vm.lab.itkey.com;

    ssl_preread on;
    proxy_pass 127.0.0.1:8443;
    proxy_protocol on;
}

# MinIO S3 API: TLS passthrough
server {
    listen 443;
    server_name minio-s3.ebochkov-client-remote-services.vm.lab.itkey.com;

    ssl_preread on;
    proxy_pass minio:9000;
}

# MinIO Web Console: TLS passthrough
server {
    listen 443;
    server_name minio.ebochkov-client-remote-services.vm.lab.itkey.com;

    ssl_preread on;
    proxy_pass minio:9001;
}