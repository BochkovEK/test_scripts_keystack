server_names_hash_bucket_size 128;
server {
    listen 8443 ssl proxy_protocol;
    server_name vault-test.ebochkov-client-remote-services.vm.lab.itkey.com;

    ssl_certificate /etc/nginx/certs/vault.crt;
    ssl_certificate_key /etc/nginx/certs/vault.key;

    location / {
        proxy_pass https://host.containers.internal:8200;
        proxy_ssl_server_name on;
        proxy_ssl_name vault-test.ebochkov-client-remote-services.vm.lab.itkey.com;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 8443 ssl proxy_protocol;
    server_name nexus-test.ebochkov-client-remote-services.vm.lab.itkey.com;

    ssl_certificate /etc/nginx/certs/nexus.crt;
    ssl_certificate_key /etc/nginx/certs/nexus.key;

    client_max_body_size 0;

    location / {
        proxy_pass http://nexus3:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 8443 ssl proxy_protocol;
    server_name docker-test.ebochkov-client-remote-services.vm.lab.itkey.com;

    ssl_certificate /etc/nginx/certs/docker.crt;
    ssl_certificate_key /etc/nginx/certs/docker.key;

    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        proxy_pass http://nexus3:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}

