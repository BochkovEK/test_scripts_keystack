# Default OpenStack Diagnostics Configuration
# This file contains default settings - copy to diag_config.yaml to customize

version: "1.0"

# Paths configuration
paths:
  log_dir: "/tmp/openstack-diag"
  reports_dir: "./reports"
  temp_dir: "/tmp/openstack-diag/tmp"

# Logging settings
logging:
  level: "INFO"
  max_log_size: "10MB"
  backup_count: 5
  console_output: true

# Ansible execution settings
ansible:
  inventory_file: "./ansible/inventory"
  timeout: 300
  forks: 10
  gather_facts: false

# Target nodes for diagnostics
nodes:
  controllers: ["controller"]
  computes: ["compute1", "compute2"]

# Services to check (enable/disable)
services:
  containers:
    enabled: true
    timeout: 60
  keystone:
    enabled: true
    timeout: 30
  galera:
    enabled: true
    timeout: 45
  rabbitmq:
    enabled: true
    timeout: 30
  nova:
    enabled: true
    timeout: 60
  cinder:
    enabled: true
    timeout: 45
  neutron:
    enabled: true
    timeout: 60

# Alert thresholds
thresholds:
  container_restarts: 10
  queue_messages: 1000
  database_connections: 90
  disk_usage_percent: 85