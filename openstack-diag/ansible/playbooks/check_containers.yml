# ansible/playbooks/check_containers.yml
- name: Check OpenStack Podman containers
  hosts: all
  tasks:
    - name: Get running containers
      shell: podman ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      register: running_containers

    - name: Get all containers (including stopped)
      shell: podman ps -a --format "table {{.Names}}\t{{.Status}}\t{{.State}}"
      register: all_containers

    - name: Show container status
      debug:
        var: running_containers.stdout