# ansible/playbooks/check_containers.yml
---
- name: Check Podman containers
  hosts: control[0],control[1]
  gather_facts: false
  tasks:
    - name: List running containers
      command: podman ps -a --format 'table {{.ID}}'
      register: containers_json
    - name: Show container list
      debug:
        var: containers_json.stdout
